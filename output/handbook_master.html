    <style>
        /* Professional Technical Book Styling */
        :root {
            --primary: #336791;
            --text: #1a1a1a;
            --bg: #ffffff;
            --code-bg: #f4f4f4;
            --border: #ddd;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #4d90bc;
                --text: #e1e1e1;
                --bg: #121212;
                --code-bg: #1e1e1e;
                --border: #333;
            }
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: var(--text); background: var(--bg); margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1, h2, h3 { color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        h1 { font-size: 2.5rem; text-align: center; margin-top: 4rem; }
        .toc { background: var(--code-bg); padding: 1.5rem; border-radius: 8px; margin-bottom: 3rem; }
        .toc ul { list-style: none; padding-left: 0; }
        .toc a { text-decoration: none; color: var(--primary); }
        pre { background: var(--code-bg); padding: 1rem; border-radius: 5px; overflow-x: auto; border: 1px solid var(--border); }
        code { font-family: 'Courier New', Courier, monospace; }
        blockquote { border-left: 5px solid var(--primary); padding: 1rem; background: var(--code-bg); font-style: italic; margin: 1.5rem 0; }
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid var(--border); padding: 0.75rem; text-align: left; }
        th { background: var(--primary); color: white; }
        .page-break { page-break-after: always; }
        @media print {
            .no-print { display: none; }
            .container { max-width: 100%; padding: 0; }
            body { font-size: 12pt; }
        }
    </style>
</head>
